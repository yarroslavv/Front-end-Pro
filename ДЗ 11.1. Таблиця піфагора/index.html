<body>
<script>
const table = document.createElement('table');

for (let i = 1; i <= 10; i++) {
    const tr = document.createElement('tr');

    for (let j = 1; j <= 10; j++) {
        const td = document.createElement('td');
        td.textContent = i * j; // таблица Пифагора
        tr.append(td);
    }

    table.append(tr);
}

document.body.append(table);
</script>
</body>
